services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-duolinting-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-duolinting_app_dev}
      MYSQL_USER: ${MYSQL_USER:-duolinting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-duolinting}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:12.9.0-alpine
    profiles:
      - tools
    depends_on:
      mysql:
        condition: service_healthy
    command: -connectRetries=10 migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-duolinting_app_dev}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER:-duolinting}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:-duolinting}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "202606080000"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./infra/mysql/migrations:/flyway/sql:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-duolinting}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-duolinting-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  minio_data:
