server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 200m;

  # Mobile web 和其它前端一样通过同源 /api 访问后端，避免生产域名下额外暴露跨域配置。
  # Docker 内部 DNS 的 TTL 保持 5 秒，backend 重启换 IP 后 nginx 会重新解析。
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $backend_upstream http://backend:4000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Expo Web 导出的 assets/ 与 _expo/ 静态产物均带内容 hash，内容变化文件名即变，
  # 可安全长缓存；index.html 不在其内，仍按默认策略，保证发新版后及时生效。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
