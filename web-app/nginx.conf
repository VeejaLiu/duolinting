server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 200m;

  # 使用 Docker 内部 DNS 服务器，设置 TTL 为 5 秒
  # 这样当 backend 容器重启获得新 IP 后，nginx 会重新解析
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    # 使用变量方式，强制每次请求都重新解析 DNS
    set $backend_upstream http://backend:4000;
    # proxy_pass 带变量时不能再额外拼接 /api/，否则 /api/v1/... 会被改写成 /api/
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite 构建产物文件名带内容 hash，内容变化文件名即变，可安全长缓存；
  # index.html 不在此目录下，仍按默认策略，保证发新版后浏览器能及时拿到新入口。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
