[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duolinting-video-generator"
version = "0.1.0"
description = "Local FFmpeg renderer for DuolinTing listening-course videos"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
dlt-video = "duolinting_video_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
