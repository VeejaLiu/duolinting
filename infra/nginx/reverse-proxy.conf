events {
    worker_connections 1024;
}

http {
    # Docker 服务重建后容器 IP 会变化。通过变量形式的 proxy_pass 强制 nginx
    # 使用 Docker 内置 DNS 定期重新解析服务名，避免 admin/mobile 等域名串站。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 媒体上传走 admin → backend 链路，外层代理必须放行大请求体
    # （默认 1m 会 413）；与内层 api-proxy/admin 的 200m 对齐。
    client_max_body_size 200m;

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name duolinting.cn www.duolinting.cn app.duolinting.cn admin.duolinting.cn mobile.duolinting.cn;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # web-app HTTPS
    server {
        listen 443 ssl;
        server_name app.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 不经 Express 读取媒体：媒体对象名不可变，Cloudflare 可安全缓存该路径
        # 一年。路径的形式为 /media/<bucket>/<objectName>，其中 objectName 保留
        # video/日期/文件名层级；rewrite 后 MinIO 收到标准 S3 path-style 请求。
        # 其它 API 仍由各前端容器的 /api/ 代理处理，不会被 CDN 缓存规则混入。
        location ^~ /media/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }

            # Cloudflare、跨域 Web 播放器和 WaveSurfer 都可能需要读取 Range
            # 响应头；媒体本身是公开课程资源，因此允许任意学习端 origin 读取。
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            # MinIO bucket 自己的 CORS 策略会按请求 Origin 写响应头；这里由
            # 公开媒体入口统一返回一组通配 CORS 头。若两个上游头同时保留，浏览器
            # 会收到两个 Access-Control-Allow-Origin 值并拒绝 WaveSurfer 的 fetch。
            # Vary: Origin 也必须隐藏：本入口始终返回 *，不应让 CDN 按 Origin
            # 分割同一个媒体对象的缓存。
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Max-Age;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Vary;
            # MinIO 的 Cache-Control 与 nosniff 也由本入口统一控制，避免重复头。
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            set $minio_media_upstream http://minio:9000;
            rewrite ^/media/(.*)$ /$1 break;
            proxy_pass $minio_media_upstream;
        }

        location / {
            set $web_app_upstream http://web-app:80;
            proxy_pass $web_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # admin HTTPS
    server {
        listen 443 ssl;
        server_name admin.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $admin_upstream http://admin:80;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # mobile app HTTPS
    server {
        listen 443 ssl;
        server_name mobile.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $mobile_app_upstream http://mobile-app:80;
            proxy_pass $mobile_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # official website HTTPS
    server {
        listen 443 ssl;
        server_name www.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $official_site_upstream http://official-site:3000;
            proxy_pass $official_site_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 裸域名统一进入官网；学习应用保留在 app 子域名，避免官网与产品入口互相覆盖。
    server {
        listen 443 ssl;
        server_name duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            return 301 https://www.duolinting.cn$request_uri;
        }
    }
}
