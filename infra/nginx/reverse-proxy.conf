events {
    worker_connections 1024;
}

http {
    # Docker 服务重建后容器 IP 会变化。通过变量形式的 proxy_pass 强制 nginx
    # 使用 Docker 内置 DNS 定期重新解析服务名，避免 admin/mobile 等域名串站。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 媒体上传走 admin → backend 链路，外层代理必须放行大请求体
    # （默认 1m 会 413）；与内层 api-proxy/admin 的 200m 对齐。
    client_max_body_size 200m;

    # HTTP 重定向到 HTTPS
    server {
        listen 80;
        server_name duolinting.cn www.duolinting.cn app.duolinting.cn admin.duolinting.cn mobile.duolinting.cn;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # web-app HTTPS
    server {
        listen 443 ssl;
        server_name app.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $web_app_upstream http://web-app:80;
            proxy_pass $web_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # admin HTTPS
    server {
        listen 443 ssl;
        server_name admin.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $admin_upstream http://admin:80;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # mobile app HTTPS
    server {
        listen 443 ssl;
        server_name mobile.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $mobile_app_upstream http://mobile-app:80;
            proxy_pass $mobile_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # official website HTTPS
    server {
        listen 443 ssl;
        server_name www.duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            set $official_site_upstream http://official-site:3000;
            proxy_pass $official_site_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 裸域名统一进入官网；学习应用保留在 app 子域名，避免官网与产品入口互相覆盖。
    server {
        listen 443 ssl;
        server_name duolinting.cn;

        ssl_certificate /etc/nginx/ssl/live/app.duolinting.cn/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/app.duolinting.cn/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            return 301 https://www.duolinting.cn$request_uri;
        }
    }
}
