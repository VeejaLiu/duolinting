# Certbot writes only public HTTP-01 challenge tokens into this webroot. The
# existing certificate-directory mount also exposes this separate directory;
# requests cannot read private keys or any other paths under that mount.
location ^~ /.well-known/acme-challenge/ {
    root /etc/nginx/ssl/acme-webroot;
    default_type text/plain;
    try_files $uri =404;
    autoindex off;
    limit_except GET HEAD { deny all; }
    # Never retain missing or previously issued challenges in an intermediary.
    add_header Cache-Control "no-store" always;
}
